[package]
name = "swofty-launcher-installer"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
swofty-core.workspace = true

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell"] }

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
