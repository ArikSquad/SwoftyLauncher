name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain rust-toolchain.toml pins, with rustfmt and clippy.
      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The real-file round trips skip without F1_25_DIR; CI has no game files.
      - name: Test
        run: cargo test

  launcher:
    name: Launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev

      - name: Clippy
        run: cargo clippy -p swofty-launcher --all-targets -- -D warnings

      - name: Build the workspace
        run: cargo build --workspace

      - name: Test
        if: runner.os == 'Windows'
        run: cargo test

  swofty-ui:
    name: Swofty UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the release build's glibc baseline.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Self-test from source
        run: python tools/swofty-ui/serve.py --self-test

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Build the executable
        run: python tools/swofty-ui/build.py

      - name: Self-test the executable
        run: dist/swofty-ui/swofty-ui --self-test

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: swofty-ui-${{ runner.os }}
          path: dist/swofty-ui/swofty-ui*
          if-no-files-found: error
          retention-days: 14

  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the release build's glibc baseline.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Clippy
        run: cargo clippy -p swofty-launcher-installer --all-targets -- -D warnings

      - name: Build
        run: cargo build --release -p swofty-launcher-installer

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: |
            target/release/swofty-launcher-installer
            target/release/swofty-launcher-installer.exe
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm --filter @f1modmanager/docs docs:build

  native:
    name: Native loader and Wine test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build version.dll, swofty_core.dll and the bundled addons
        run: native/build.sh

      - name: Bundled addon packages
        run: |
          python3 - <<'EOF'
          import glob, json, zipfile
          pkgs = sorted(glob.glob('native/bundled/*.swoftyaddon'))
          assert pkgs, 'native/build.sh packaged no bundled addons'
          for p in pkgs:
              z = zipfile.ZipFile(p)
              names = z.namelist()
              assert 'swofty.json' in names, f'{p}: no swofty.json at the root'
              m = json.loads(z.read('swofty.json'))
              for n in m.get('operations', {}).get('native', []):
                  assert n['dll'] in names, f"{p}: {n['dll']} is missing"
              assert not any(n.startswith('native/build/') for n in names), f'{p}: build files packaged'
              print(p, names)
          EOF

      - name: RE-Optimization settings delta unit test
        run: addons/re-optimization/native/test/run.sh

      - name: Events dispatcher unit test
        run: native/test/run_events_test.sh
      - name: Overlay draw-list unit test
        run: native/test/run_hud_test.sh
      - name: Telemetry feed unit test
        run: |
          zig c++ -std=c++23 -O2 -I packages/sdk/include native/test/telemetry_feed_test.cpp -o telemetry_feed_test
          ./telemetry_feed_test

      - name: Wine and Xvfb
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine xvfb

      # A synthetic F1_25.exe carries the signatures; no game files are used.
      - name: Wine test
        run: native/test/run_wine_test.sh

      - name: Runtime assets Wine test
        run: native/test/run_runtime_assets_test.sh
