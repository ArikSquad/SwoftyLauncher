name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request runs only the jobs whose files it changes; a push to main runs every job.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      installer: ${{ github.event_name != 'pull_request' || steps.filter.outputs.installer == 'true' }}
      native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
      swofty-ui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.swofty-ui == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # Every area: this workflow, and the line-ending rules every checkout applies.
            always: &always
              - .github/workflows/ci.yml
              - .gitattributes
            # Every crate, plus the files outside them that the crates embed or their tests read.
            rust:
              - *always
              - '**/*.rs'
              - '**/Cargo.toml'
              - Cargo.lock
              - rust-toolchain.toml
              - rustfmt.toml
              - apps/**
              - packages/**
              - installer/**
              - templates/**
              - addons/builtins/**
              - addons/swoftymod/**
              - addons/custom-grid-size/**
              - re/db/functions.tsv
              - tools/gamedb/catalog/**
            # The installer crate, its path dependencies (swofty-core, -addon, -formats, -sdk) and what they embed.
            installer:
              - *always
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - installer/**
              - packages/core/**
              - packages/addon-api/**
              - packages/formats/**
              - packages/sdk/**
              - tools/gamedb/catalog/**
              - templates/addon/native/include/**
              - addons/swoftymod/swofty.json
              - apps/launcher/assets/**
            # native/build.sh bundles the whole re-optimization addon, so its manifest and README count too.
            native:
              - *always
              - native/**
              - re/**
              - addons/*/native/**
              - addons/re-optimization/**
              - packages/sdk/**
              - tools/pack_addon.py
              - tools/rtassets.py
            # build.py puts tools/ on the module path; the app imports erp, pkg and idf from there.
            swofty-ui:
              - *always
              - tools/swofty-ui/**
              - tools/erp.py
              - tools/pkg.py
              - tools/idf.py
            docs:
              - *always
              - docs/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain rust-toolchain.toml pins, with rustfmt and clippy.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      # Only main saves, so pull requests restore main's caches instead of evicting them with their own.
      # The environment hash would fold in every installed rustc, and runner images differ in the stable
      # one they preinstall; the key keeps the lockfile and rust-toolchain.toml hash, which is what matters.
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          shared-key: workspace-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # The launcher and the installer are not default members; --workspace reaches them too.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the workspace
        run: cargo build --workspace

      # --workspace takes in the launcher's and the installer's tests too. The real-file round trips skip
      # without F1_25_DIR; CI has no game files.
      - name: Test
        run: cargo test --workspace

  swofty-ui:
    name: Swofty UI (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.swofty-ui == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the release build's glibc baseline.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Self-test from source
        run: python tools/swofty-ui/serve.py --self-test

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Build the executable
        run: python tools/swofty-ui/build.py

      - name: Self-test the executable
        run: dist/swofty-ui/swofty-ui --self-test

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: swofty-ui-${{ runner.os }}
          path: dist/swofty-ui/swofty-ui*
          if-no-files-found: error
          retention-days: 14

  # The rust job lints the installer on both systems; this job builds the release binary people test.
  installer:
    name: Installer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the release build's glibc baseline.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          shared-key: installer-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release -p swofty-launcher-installer

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: |
            target/release/swofty-launcher-installer
            target/release/swofty-launcher-installer.exe
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Documentation build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          require-lockfile: true

      - name: Build
        run: pnpm --filter @f1modmanager/docs docs:build

  native:
    name: Native loader and Wine test
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the Wine tests need these, so the install runs in the background while the build and unit tests do.
      - name: Start installing Wine and Xvfb
        run: |
          (
            set +e
            sudo dpkg --add-architecture i386 &&
              sudo apt-get update &&
              sudo apt-get install -y wine64 wine xvfb
            echo $? > "$RUNNER_TEMP/wine-install.status"
          ) > "$RUNNER_TEMP/wine-install.log" 2>&1 &

      # The binding generator, capture and verifier tests use only the standard library.
      - name: RE tools unit tests
        run: python3 -m unittest discover -s re/tools/tests

      # The native scripts pin their compilers to the maintainer's healthy cores (taskset -c 2-7,...),
      # which leaves two of a hosted runner's four. This shim drops the pin and runs the command as is.
      - name: Use every runner core
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/taskset" <<'EOF'
          #!/bin/sh
          [ "$1" = -c ] && shift 2
          exec "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/taskset"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The scripts below keep their own Zig cache under native/build, which the restore step covers.
      # The tool cache installs Zig at the same path every run; the MinGW and libc++ objects are keyed
      # on compiler arguments that include that path, so the default random temp folder missed them all.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
          use-tool-cache: true

      # The key starts over each month so the content-addressed cache cannot grow without bound.
      - name: Zig cache period
        id: zig-period
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the Zig cache
        id: zig-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            native/build/zig-cache
            addons/re-optimization/native/build/zig-cache
          key: zig-${{ runner.os }}-0.16.0-${{ steps.zig-period.outputs.month }}-${{ hashFiles('native/**', 'addons/*/native/**', 'packages/sdk/include/**') }}
          restore-keys: zig-${{ runner.os }}-0.16.0-${{ steps.zig-period.outputs.month }}-

      - name: Build version.dll, swofty_core.dll and the bundled addons
        run: native/build.sh

      - name: Bundled addon packages
        run: |
          python3 - <<'EOF'
          import glob, json, zipfile
          pkgs = sorted(glob.glob('native/bundled/*.swoftyaddon'))
          assert pkgs, 'native/build.sh packaged no bundled addons'
          for p in pkgs:
              z = zipfile.ZipFile(p)
              names = z.namelist()
              assert 'swofty.json' in names, f'{p}: no swofty.json at the root'
              m = json.loads(z.read('swofty.json'))
              for n in m.get('operations', {}).get('native', []):
                  assert n['dll'] in names, f"{p}: {n['dll']} is missing"
              assert not any(n.startswith('native/build/') for n in names), f'{p}: build files packaged'
              print(p, names)
          EOF

      - name: Events dispatcher unit test
        run: native/test/run_events_test.sh
      - name: Overlay draw-list unit test
        run: native/test/run_hud_test.sh
      - name: Shader look unit test
        run: native/test/run_grade_test.sh
      - name: Pattern scan and scan cache unit test
        run: native/test/run_scan_test.sh
      - name: Telemetry feed unit test
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
        run: |
          zig c++ -target x86_64-linux-musl -std=c++23 -O2 -I packages/sdk/include native/test/telemetry_feed_test.cpp -o telemetry_feed_test
          ./telemetry_feed_test
      - name: Career Mode Editor race number unit test
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
        run: |
          zig c++ -target x86_64-linux-musl -std=c++23 -O2 -I addons/career-editor/native/src addons/career-editor/native/test/race_numbers_test.cpp addons/career-editor/native/src/race_numbers.cpp -o race_numbers_test
          ./race_numbers_test
      - name: Career Mode Editor weather plan unit test
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
        run: |
          zig c++ -target x86_64-linux-musl -std=c++23 -O2 -I addons/career-editor/native/src addons/career-editor/native/test/weather_plan_test.cpp addons/career-editor/native/src/weather_plan.cpp -o weather_plan_test
          ./weather_plan_test
      - name: Career Mode Editor line-up unit test
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
        run: |
          zig c++ -target x86_64-linux-musl -std=c++23 -O2 -I addons/career-editor/native/src addons/career-editor/native/test/lineup_test.cpp addons/career-editor/native/src/lineup.cpp -o lineup_test
          ./lineup_test
      - name: Career Mode Editor rating search unit test
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
        run: |
          zig c++ -target x86_64-linux-musl -std=c++23 -O2 -I addons/career-editor/native/src addons/career-editor/native/test/rating_solve_test.cpp addons/career-editor/native/src/rating_solve.cpp -o rating_solve_test
          ./rating_solve_test
      - name: Career Mode Editor calendar rules unit test
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
        run: |
          zig c++ -target x86_64-linux-musl -std=c++23 -O2 -I addons/career-editor/native/src addons/career-editor/native/test/calendar_rules_test.cpp addons/career-editor/native/src/calendar_rules.cpp -o calendar_rules_test
          ./calendar_rules_test
      - name: Any Team Transfers unit test and build
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/native/build/zig-cache
          AT_TEST_DIR: ${{ runner.temp }}/any-team-test
        run: |
          addons/any-team-transfers/native/test/run.sh
          addons/any-team-transfers/native/build.sh

      - name: Wine and Xvfb
        timeout-minutes: 10
        run: |
          while [ ! -f "$RUNNER_TEMP/wine-install.status" ]; do sleep 2; done
          cat "$RUNNER_TEMP/wine-install.log"
          exit "$(cat "$RUNNER_TEMP/wine-install.status")"

      - name: RE-Optimization unit and Wine hook tests
        run: addons/re-optimization/native/test/run.sh

      # A synthetic F1_25.exe carries the signatures; no game files are used.
      - name: Wine test
        run: native/test/run_wine_test.sh

      - name: Overlay toolkit Wine test
        run: native/test/run_toolkit_test.sh

      # Without work/exe/F1_25.exe it runs the synthetic packed image only.
      - name: Binding resolver Wine test
        run: native/test/run_bind_test.sh

      - name: Runtime assets Wine test
        run: native/test/run_runtime_assets_test.sh

      - name: String override Wine test
        run: native/test/run_lang_override_test.sh

      - name: Career UI Wine test
        run: native/test/run_career_ui_test.sh

      - name: Loader log fallback Wine test
        run: native/test/run_log_fallback_test.sh

      - name: Socket trace Wine test
        run: native/test/run_net_trace_test.sh

      - name: Socket hooks Wine test
        run: native/test/run_netplay_test.sh

      # Saved after the Wine tests, which compile their fixtures into the same cache.
      - name: Save the Zig cache
        if: github.ref == 'refs/heads/main' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            native/build/zig-cache
            addons/re-optimization/native/build/zig-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

  # Every push to main also builds the release binaries: the run keeps the release cache warm, and a tag on
  # this commit takes its binaries from here (release.yml) instead of building again.
  release-binaries:
    name: Release binaries
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-binaries.yml
    with:
      ref: ${{ github.sha }}
      retention-days: 7
