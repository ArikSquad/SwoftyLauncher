[project]
name = "swofty-triage"
version = "0.1.0"
description = "Diagnoses the logs that Send Logs to Developers posts to Discord"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.17,<2",
    "discord.py>=2.7,<3",
]

[project.scripts]
swofty-triage = "swofty_triage.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swofty_triage"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
