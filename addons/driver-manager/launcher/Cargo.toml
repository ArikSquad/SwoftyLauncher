[package]
name = "driver-manager-helper"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "driver_manager"
path = "src/lib.rs"

[[bin]]
name = "driver-manager-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
png = "0.18"
serde_json = "1"
swofty-formats = { path = "../../../packages/formats" }

[dev-dependencies]
swofty-addon = { path = "../../../packages/addon-api" }
swofty-core = { path = "../../../packages/core" }

[profile.release]
opt-level = "s"
strip = true

[workspace]
