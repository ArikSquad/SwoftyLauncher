[workspace]
resolver = "3"
members = ["apps/cli", "apps/launcher", "packages/addon-api", "packages/core", "packages/formats", "packages/sdk"]
default-members = ["apps/cli", "packages/addon-api", "packages/core", "packages/formats", "packages/sdk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Swofty-Developments/F1ModManager"

[workspace.dependencies]
swofty-addon = { path = "packages/addon-api" }
swofty-core = { path = "packages/core" }
swofty-formats = { path = "packages/formats" }
swofty-sdk = { path = "packages/sdk" }
anyhow = "1"
bcdec_rs = "0.2"
clap = { version = "4", features = ["derive", "env"] }
md-5 = "0.11"
png = "0.18"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = { version = "0.14", features = ["zstdmt"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
